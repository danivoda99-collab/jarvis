# Paznicul tehnic al lui Argus: la ~10 minute cheamă /api/paznic, care verifică laptopul, coada, Google și cheile
# și trimite notificare pe telefon când ceva pică. Dacă nici aplicația nu răspunde, rularea eșuează și GitHub trimite mail.
name: Paznic Argus

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verifică Argus
        run: curl -fsS --retry 2 --retry-delay 20 --max-time 60 https://jarvis-one-psi-36.vercel.app/api/paznic
